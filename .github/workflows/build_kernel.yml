name: Build prime kernel

on:
  push:
    branches:
      - sixteen

  workflow_dispatch:
    inputs:
      release:
        description: 'Upload GitHub Release'
        type: boolean
        required: true
        default: false

      changelog:
        description: 'Release changelog'
        type: string
        required: false

jobs:
  prepare:
    name: Prepare build information
    runs-on: ubuntu-22.04

    outputs:
      release_ts: ${{ steps.ts.outputs.release_ts }}

    steps:
      - name: Generate release timestamp
        id: ts
        run: |
          RELEASE_TS=$(date +'%Y%m%d-%H%M%S')
          echo "release_ts=$RELEASE_TS" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.device.name }}
    runs-on: ubuntu-22.04
    needs: prepare

    strategy:
      fail-fast: false
      matrix:
        device:
          - name: a71
            device2: a71xxx
            soc: sdmmagpie

          - name: a70q
            device2: a70
            soc: sm6150

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v5
        with:
          submodules: true
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            cpio \
            curl \
            flex \
            g++ \
            gcc \
            gcc-aarch64-linux-gnu \
            git \
            kmod \
            libelf-dev \
            libncurses-dev \
            libssl-dev \
            lz4 \
            make \
            python3 \
            python-is-python3 \
            rsync \
            unzip \
            wget \
            zip \
            zstd

      - name: Download Android Clang
        run: |
          set -e

          URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/mirror-goog-main-llvm-toolchain-source/clang-r596125.tar.gz"

          rm -rf llvm-22 llvm.tar.gz
          mkdir -p llvm-22

          curl -fL \
            --retry 5 \
            --retry-all-errors \
            --retry-delay 5 \
            --connect-timeout 30 \
            "$URL" \
            -o llvm.tar.gz

          echo "Checking Clang archive..."
          gzip -t llvm.tar.gz

          echo "Extracting Clang..."
          tar -xzf llvm.tar.gz -C llvm-22

          rm llvm.tar.gz

          llvm-22/bin/clang --version

      - name: Build kernel image and device trees
        run: |
          chmod +x build.sh

          bash build.sh \
            "${{ matrix.device.name }}" \
            "${{ matrix.device.device2 }}" \
            "${{ matrix.device.soc }}"

      - name: Build and install kernel modules
        run: |
          set -e

          export ARCH=arm64
          export PATH="$GITHUB_WORKSPACE/llvm-22/bin:$PATH"

          make \
            -C "$GITHUB_WORKSPACE" \
            O="$GITHUB_WORKSPACE/out" \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            LLVM=1 \
            LLVM_IAS=1 \
            -j"$(nproc)" \
            modules

          MODULE_PATH="$RUNNER_TEMP/module-install"

          mkdir -p "$MODULE_PATH"
          mkdir -p "$GITHUB_WORKSPACE/AnyKernel3/modules"

          make \
            -C "$GITHUB_WORKSPACE" \
            O="$GITHUB_WORKSPACE/out" \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            LLVM=1 \
            LLVM_IAS=1 \
            INSTALL_MOD_PATH="$MODULE_PATH" \
            modules_install

          find "$MODULE_PATH" \
            -type f \
            -name '*.ko' \
            -exec cp {} "$GITHUB_WORKSPACE/AnyKernel3/modules/" \;

      - name: Generate release notes
        if: matrix.device.name == 'a71'
        run: |
          : > version.txt

          echo "**Kernel version:** $(cat out/include/config/kernel.release)  " >> version.txt

          echo >> version.txt

          KHASH="$(git rev-parse HEAD)"

          echo "**Kernel source:** [$KHASH](https://github.com/sympbiotic/android_kernel_samsung_sm7150/tree/$KHASH)" >> version.txt

          if [ "${{ inputs.release }}" = "true" ] && \
             [ -n "${{ inputs.changelog }}" ]; then

            echo >> version.txt
            echo "**Changelog:**" >> version.txt
            echo >> version.txt

            printf "%b\n" "${{ inputs.changelog }}" >> version.txt
          fi

      - name: Upload kernel artifact
        uses: actions/upload-artifact@v5
        with:
          name: PrimeKernel-${{ matrix.device.name }}-${{ needs.prepare.outputs.release_ts }}
          path: AnyKernel3/
          if-no-files-found: error
          retention-days: 7

      - name: Upload release notes artifact
        if: matrix.device.name == 'a71'
        uses: actions/upload-artifact@v5
        with:
          name: release-notes
          path: version.txt
          retention-days: 1

  release:
    name: Publish GitHub Release
    needs:
      - prepare
      - build

    if: ${{ github.event_name == 'workflow_dispatch' && inputs.release }}

    runs-on: ubuntu-22.04

    steps:
      - name: Download kernel artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: PrimeKernel-*
          path: artifacts/
          merge-multiple: false

      - name: Package kernel ZIP files
        run: |
          set -e

          cd artifacts

          for dir in PrimeKernel-*; do
            (
              cd "$dir"
              zip -r "../${dir}.zip" .
            )
          done

      - name: Download release notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: ./

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          body_path: version.txt
          tag_name: ${{ needs.prepare.outputs.release_ts }}
          name: PrimeKernel-${{ needs.prepare.outputs.release_ts }}
          files: artifacts/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
